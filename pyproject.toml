[project]
name = "needle"
version = "0.1.0"
description = "A kanban over a corpus of plans, for a team made of one owner and many AI sessions that share no memory."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "uvicorn[standard]>=0.32",
    "watchfiles>=0.24",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "websockets>=17.1",
]

[project.scripts]
needle = "api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domain", "board", "infrastructure", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # starlette's own test client reaches an anyio alias it has not yet moved off; not ours
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
